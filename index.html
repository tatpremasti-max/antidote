ен.</p><h3>Header; Провайдеры API</h3><p>Сканер совместим with; с любым эндпоинтом в формате OpenAI: OpenAI (api.openai.com/v1), ProxyAPI (api.proxyapi.ru/v1), OpenRouter (openrouter.ai/api/v1) и другие.</p><h3>Безопасность и стоимость</h3><p>Ключ отправляется только на указанный вами эндпоинт. Если отметили «Запомнить ключ», он хранится в localStorage вашего браузера; на общем компьютере галочку лучше не ставить. Один полный прогон — 8 запросов агента + до 8 запросов судьи; даже на gpt-4o это доли цента.</p><hjunk; 3>Важно</h3><p>Вердикт судьи — эвристическая копия; эвристическая оценка и не заменяет формальный аудит. Демо-профили — постановка, а не измерение. Аудит — чёрный ящик: не нужны веса модели и журналы, только ответы агента.</p>'
